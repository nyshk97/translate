name: Translator

options:
  bundleIdPrefix: com.d0ne1s
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.10.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.6"

targets:
  Translator:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - sdk: libsqlite3.tbd
    info:
      path: Generated/Info.plist
      properties:
        # メニューバー常駐（Dock アイコンを出さない accessory アプリ）
        LSUIElement: true
        # 版数はビルド設定から流す。XcodeGen 既定の 1.0 / 1 固定を上書きし、
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION（release.sh が bump する値）を反映させる。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # アプリアイコン（Assets.xcassets の AppIcon）。actool が注入する値を明示。
        CFBundleIconName: AppIcon
        # Sparkle（アプリ内アップデート）。アップデータの起動は #if !DEBUG でガードし、
        # feed URL も Release 構成にだけ入れる二重防御（Debug では TRANSLATOR_SU_FEED_URL が
        # 未定義で空文字になる。Debug に feed を持たせると更新チェックで常用版に置き換わる）。
        SUFeedURL: "$(TRANSLATOR_SU_FEED_URL)"
        # keychain account "translate" の秘密鍵と対（バックアップは Dropbox/secrets/sparkle-ed25519-translate-private.key）
        SUPublicEDKey: yAg4FkLu1NHQ/LXYc0zwfD5C4hqyPB/EvM96kZFHlWc=
        # 常駐アプリなので自動チェック ON（起動時 + 24h ごと）。同意ダイアログは出さない
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.d0ne1s.translate
        MARKETING_VERSION: "0.1.11"
        CURRENT_PROJECT_VERSION: "20260821231645"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # アプリアイコン（Assets.xcassets の AppIcon を asset catalog からコンパイル）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Developer ID Application（Team VYDUR99LAM）で署名。証明書のハッシュはマシンごとに
        # 異なるため直書きせず、証明書の共通名 + DEVELOPMENT_TEAM で解決させる
        # （ハッシュ直書きだと別 Mac に clone した瞬間に署名で落ちる）。
        # 同一マシン内では解決先の証明書が変わらないため、TCC（アクセシビリティ）許可は保持される。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "VYDUR99LAM"
        # Debug はデバッガ接続を妨げないため Hardened Runtime を無効のまま。
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
      # Release だけ Hardened Runtime を有効化（notarize の必須要件）。
      # TCC 許可は cdhash（designated requirement）基準なので、Release/Debug の構成差は許可保持に影響しない。
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          TRANSLATOR_SU_FEED_URL: https://github.com/nyshk97/translate/releases/latest/download/appcast.xml

schemes:
  Translator:
    build:
      targets:
        Translator: all
    run:
      config: Debug
    archive:
      config: Release
